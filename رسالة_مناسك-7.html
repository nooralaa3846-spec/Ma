<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى العروس مناسك 💍</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe4ef,#fff8fb);display:flex;justify-content:center;align-items:center;overflow:hidden}
.background{position:fixed;inset:0;pointer-events:none}
.heart{position:absolute;font-size:25px;animation:float 6s linear infinite;opacity:.7}
.heart:nth-child(1){left:10%;animation-delay:0s}.heart:nth-child(2){left:30%;animation-delay:2s}.heart:nth-child(3){left:55%;animation-delay:1s}.heart:nth-child(4){left:75%;animation-delay:3s}.heart:nth-child(5){left:90%;animation-delay:1.5s}
@keyframes float{0%{bottom:-50px;transform:translateX(0) rotate(0)}50%{transform:translateX(30px) rotate(20deg)}100%{bottom:110%;transform:translateX(-20px) rotate(-20deg)}}
.card{width:90%;max-width:500px;background:rgba(255,255,255,.92);border-radius:30px;padding:40px 25px;text-align:center;box-shadow:0 15px 40px rgba(180,90,130,.2);position:relative;z-index:2}
.start h1{color:#c34f7b;font-size:35px}.start p{color:#777;font-size:18px}
button{border:0;background:linear-gradient(135deg,#d85d8b,#b83f6d);color:#fff;padding:15px 35px;border-radius:30px;font-size:18px;cursor:pointer;box-shadow:0 8px 20px rgba(190,70,120,.3)}
.message{display:none;animation:appear 1.5s ease forwards}
.message h1{color:#c34f7b;font-size:32px;margin-bottom:25px}
.message p{color:#555;font-size:20px;line-height:2}
.final{color:#c34f7b!important;font-weight:bold;font-size:23px!important;margin-top:25px}
@keyframes appear{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.sparkle{position:fixed;font-size:20px;animation:sparkle 2s infinite}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<div class="background">
<div class="heart">❤️</div><div class="heart">💗</div><div class="heart">💕</div><div class="heart">💖</div><div class="heart">🤍</div>
</div>
<div class="card">
<div class="start" id="start">
<div style="font-size:70px">💍</div>
<h1>إلى العروس الجميلة</h1>
<p>عندي ليكِ رسالة صغيرة يا مناسك ❤️</p>
<button onclick="openMessage()">افتحي رسالتك 💌</button>
</div>
<div class="message" id="message">
<div style="font-size:65px">👰🏻‍♀️💍</div>
<h1>الأروووسسس مناسك ❤️❤️💃💃💃</h1>
<p>ربي يبارك ليكِ في حياتك الجديدة،<br>ويكتب ليكِ فيها السعادة والطمأنينة،<br>ويجعل كل خطوة جاية أجمل من السابقة 🌸</p>
<p class="final">ألف مبروك يا أجمل عروس 💍🤍</p>
<div style="font-size:35px">🌸💗✨🌷✨💗🌸</div>
</div>
</div>
<script>
function openMessage(){
document.getElementById("start").style.display="none";
document.getElementById("message").style.display="block";
for(let i=0;i<20;i++){
let s=document.createElement("div");s.className="sparkle";
s.innerHTML=Math.random()>.5?"✨":"💗";
s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
s.style.animationDelay=Math.random()*2+"s";document.body.appendChild(s);
}}
</script>
</body>
</html>
